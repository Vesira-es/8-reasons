<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carrito · Vesira</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@300;400;500;600;700&family=Material+Symbols+Outlined"
    rel="stylesheet"
  >

  <style>
    :root {
      --f: #0a0a0a;
      --t: #fff;
      --s: #8c8c8c;
      --b: rgba(255, 255, 255, .1);
      --c: #141414;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--f);
      color: var(--t);
      font-family: Outfit, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .wrap {
      width: min(1100px, calc(100% - 28px));
      margin: auto;
      padding: 115px 0 80px;
    }

    .head {
      margin-bottom: 28px;
    }

    .eyebrow {
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--s);
      margin-bottom: 10px;
    }

    h1 {
      font-family: Bricolage Grotesque, Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(52px, 7vw, 88px);
      letter-spacing: -.075em;
      line-height: .82;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 18px;
      align-items: start;
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .item {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 16px;
      padding: 10px;
      border: 1px solid var(--b);
      border-radius: 20px;
      background: #101010;
    }

    .img {
      width: 130px;
      aspect-ratio: 1 / .9;
      background: #f2f2ef;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img img {
      width: 88%;
      height: 88%;
      object-fit: contain;
    }

    .info h2 {
      font-family: Bricolage Grotesque, Arial, sans-serif;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: -.05em;
      margin-bottom: 6px;
    }

    .price {
      font-size: 11px;
      color: var(--s);
      margin-bottom: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty {
      display: flex;
      align-items: center;
      border: 1px solid var(--b);
      border-radius: 999px;
    }

    .qty button {
      width: 30px;
      height: 29px;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
    }

    .qty button:hover {
      color: #aaa;
    }

    .qty span {
      min-width: 28px;
      text-align: center;
      font-size: 10px;
    }

    .del {
      border: 0;
      background: transparent;
      color: #707070;
      font-size: 9px;
      cursor: pointer;
    }

    .del:hover {
      color: #fff;
    }

    .totalitem {
      font-size: 12px;
      white-space: nowrap;
    }

    .summary {
      position: sticky;
      top: 90px;
      align-self: start;
      padding: 17px 19px;
      border: 1px solid var(--b);
      border-radius: 22px;
      background: #101010;
    }

    .summary h2 {
      font-family: Bricolage Grotesque, Arial, sans-serif;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -.05em;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      color: var(--s);
      font-size: 11px;
    }

    .row strong {
      color: #fff;
      font-weight: 500;
    }

    .buy {
      width: 100%;
      min-height: 50px;
      margin-top: 15px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #0a0a0a;
      font-size: 11px;
      cursor: pointer;
      transition: background .2s, color .2s, transform .2s;
    }

    .buy:hover {
      background: #dedede;
      transform: translateY(-1px);
    }

    .buy:focus-visible,
    .qty button:focus-visible,
    .del:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .continue {
      display: block;
      margin-top: 11px;
      color: var(--s);
      font-size: 9px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .continue:hover {
      color: #fff;
    }

    .empty {
      border: 1px solid var(--b);
      border-radius: 22px;
      padding: 70px 20px;
      text-align: center;
    }

    .empty h2 {
      font-family: Bricolage Grotesque, Arial, sans-serif;
      font-size: 40px;
      font-weight: 400;
      letter-spacing: -.06em;
      margin-bottom: 10px;
    }

    .empty p {
      color: var(--s);
      font-size: 11px;
      margin-bottom: 20px;
    }

    .empty a {
      display: inline-flex;
      padding: 0 20px;
      height: 46px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #fff;
      color: #0a0a0a;
      font-size: 10px;
      transition: background .2s;
    }

    .empty a:hover {
      background: #dedede;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translate(-50%, 15px);
      opacity: 0;
      visibility: hidden;
      background: #161616;
      border: 1px solid var(--b);
      border-radius: 999px;
      padding: 11px 15px;
      font-size: 10px;
      transition: opacity .25s, transform .25s, visibility .25s;
      z-index: 20;
      pointer-events: none;
    }

    .toast.on {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }
    }

    @media (max-width: 600px) {
      .wrap {
        padding-top: 100px;
      }

      .item {
        grid-template-columns: 92px 1fr;
        gap: 10px;
      }

      .img {
        width: 92px;
      }

      .info h2 {
        font-size: 20px;
      }

      .totalitem {
        grid-column: 2;
        justify-self: end;
        margin-top: -24px;
      }

      .summary {
        padding: 15px 16px;
      }

      .summary h2 {
        font-size: 24px;
        margin-bottom: 12px;
      }

      .empty h2 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR DE VESIRA -->
  <script src="vesira-navbar.js"></script>

  <main class="wrap">

    <header class="head">
      <h1>Tu carrito</h1>
    </header>

    <div id="content"></div>

  </main>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    const content = document.getElementById('content');
    const toast = document.getElementById('toast');

    const CART_KEY = 'vesiraCarrito';

    let toastTimer;


    /* =========================================================
       CONVERSIÓN SEGURA A NÚMERO
    ========================================================= */

    function numberOrZero(value) {
      const number = Number(value);

      return Number.isFinite(number) ? number : 0;
    }


    /* =========================================================
       LEER CARRITO
    ========================================================= */

    function getCart() {
      try {
        const raw = localStorage.getItem(CART_KEY);

        if (!raw) {
          return [];
        }

        const cart = JSON.parse(raw);

        return Array.isArray(cart)
          ? cart.filter(item => item && typeof item === 'object')
          : [];

      } catch (error) {
        console.error('Error leyendo el carrito:', error);
        return [];
      }
    }


    /* =========================================================
       CONTAR UNIDADES REALES

       Un producto con cantidad 4 = 4 unidades.
       Dos productos con cantidades 2 y 3 = 5 unidades.
    ========================================================= */

    function getCartCount(cart = getCart()) {
      return cart.reduce((total, item) => {
        const cantidad = Math.max(
          0,
          numberOrZero(item.cantidad)
        );

        return total + cantidad;
      }, 0);
    }


    /* =========================================================
       ACTUALIZAR VISUALMENTE EL CONTADOR DE LA NAVBAR

       Esta función modifica los contadores de la página,
       pero NO emite eventos. Así evitamos bucles infinitos.
    ========================================================= */

    function setNavbarCartCount(count = getCartCount()) {
      const counters = document.querySelectorAll(
        '[data-cart-count], ' +
        '[data-cart-badge], ' +
        '.cart-count, ' +
        '.cart-badge, ' +
        '#cart-count, ' +
        '#cart-badge'
      );

      counters.forEach(counter => {
        counter.textContent = count;

        counter.style.display = count > 0 ? '' : 'none';
      });
    }


    /* =========================================================
       ACTUALIZAR CONTADOR Y NOTIFICAR A OTRAS PARTES DE VESIRA

       El evento se emite una sola vez. El listener de este
       archivo solo actualiza el contador visual y no vuelve
       a emitir el mismo evento.
    ========================================================= */

    function updateNavbarCartCount() {
      const cart = getCart();
      const count = getCartCount(cart);

      setNavbarCartCount(count);

      window.dispatchEvent(
        new CustomEvent('vesira:cart-updated', {
          detail: {
            cart: cart,
            count: count
          }
        })
      );
    }


    /* =========================================================
       GUARDAR CARRITO
    ========================================================= */

    function saveCart(cart) {
      try {
        localStorage.setItem(
          CART_KEY,
          JSON.stringify(cart)
        );

        updateNavbarCartCount();

        return true;

      } catch (error) {
        console.error('Error guardando el carrito:', error);

        msg('No se pudo guardar el carrito');

        return false;
      }
    }


    /* =========================================================
       FORMATO DE PRECIO
    ========================================================= */

    function eur(value) {
      const number = numberOrZero(value);

      return number.toFixed(2).replace('.', ',') + ' €';
    }


    /* =========================================================
       MENSAJES TEMPORALES
    ========================================================= */

    function msg(text) {
      toast.textContent = text;

      toast.classList.add('on');

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove('on');
      }, 1400);
    }


    /* =========================================================
       CAMBIAR CANTIDAD
    ========================================================= */

    function qty(id, delta) {
      const cart = getCart();

      const item = cart.find(
        i => String(i.id) === String(id)
      );

      if (!item) {
        return;
      }

      const currentQuantity = Math.max(
        1,
        numberOrZero(item.cantidad || 1)
      );

      item.cantidad = Math.max(
        1,
        currentQuantity + numberOrZero(delta)
      );

      if (!saveCart(cart)) {
        return;
      }

      render();

      if (delta > 0) {
        msg('Unidad añadida');
      } else {
        msg('Unidad retirada');
      }
    }


    /* =========================================================
       ELIMINAR PRODUCTO
    ========================================================= */

    function removeItem(id) {
      const cart = getCart();

      const newCart = cart.filter(
        item => String(item.id) !== String(id)
      );

      if (!saveCart(newCart)) {
        return;
      }

      render();

      msg('Producto eliminado');
    }


    /* =========================================================
       ESCAPAR HTML

       Evita que los valores de los productos se interpreten
       como etiquetas HTML o atributos ejecutables.
    ========================================================= */

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    /* =========================================================
       RENDERIZAR CARRITO
    ========================================================= */

    function render() {
      const cart = getCart();

      // Sincronizar contador al actualizar la página.
      updateNavbarCartCount();


      /* =======================================================
         CALCULAR SUBTOTAL
      ======================================================= */

      const subtotal = cart.reduce((sum, item) => {
        const precio = Math.max(
          0,
          numberOrZero(item.precio)
        );

        const cantidad = Math.max(
          0,
          numberOrZero(item.cantidad)
        );

        return sum + (precio * cantidad);

      }, 0);


      /* =======================================================
         CARRITO VACÍO
      ======================================================= */

      if (!cart.length) {
        content.innerHTML = `
          <section class="empty">

            <h2>
              Tu carrito está vacío.
            </h2>

            <p>
              Aún no has añadido ningún par.
            </p>

            <a href="index.html">
              Ver gafas
            </a>

          </section>
        `;

        return;
      }


      /* =======================================================
         LISTA DE PRODUCTOS
      ======================================================= */

      content.innerHTML = `
        <div class="layout">

          <section class="items" aria-label="Productos del carrito">

            ${cart.map(item => {
              const cantidad = Math.max(
                1,
                numberOrZero(item.cantidad || 1)
              );

              const precio = Math.max(
                0,
                numberOrZero(item.precio)
              );

              const totalItem = precio * cantidad;

              const id = escapeHtml(String(item.id ?? ''));
              const imagen = escapeHtml(item.imagen || '');
              const nombre = escapeHtml(item.nombre || 'Vesira');

              return `
                <article class="item">

                  <div class="img">

                    <img
                      src="${imagen}"
                      alt="${nombre}"
                      loading="lazy"
                    >

                  </div>

                  <div class="info">

                    <h2>${nombre}</h2>

                    <div class="price">
                      ${eur(precio)}
                    </div>

                    <div class="controls">

                      <div class="qty" aria-label="Cantidad">

                        <button
                          type="button"
                          data-action="decrease"
                          data-id="${id}"
                          aria-label="Quitar una unidad de ${nombre}"
                        >
                          −
                        </button>

                        <span>${cantidad}</span>

                        <button
                          type="button"
                          data-action="increase"
                          data-id="${id}"
                          aria-label="Añadir una unidad de ${nombre}"
                        >
                          +
                        </button>

                      </div>

                      <button
                        type="button"
                        class="del"
                        data-action="remove"
                        data-id="${id}"
                        aria-label="Eliminar ${nombre} del carrito"
                      >
                        Eliminar
                      </button>

                    </div>

                  </div>

                  <div class="totalitem">
                    ${eur(totalItem)}
                  </div>

                </article>
              `;
            }).join('')}

          </section>


          <!-- RESUMEN DEL CARRITO -->

          <aside class="summary">

            <h2>
              Resumen
            </h2>

            <div class="row">

              <span>
                Subtotal
              </span>

              <strong>
                ${eur(subtotal)}
              </strong>

            </div>

            <!--
              El formulario de reserva se creará en reserva.html.
              Este botón redirige a esa página.
            -->

            <button
              class="buy"
              id="buy"
              type="button"
              data-action="reserve"
            >
              Reservar
            </button>

            <a
              class="continue"
              href="index.html"
            >
              Seguir comprando
            </a>

          </aside>

        </div>
      `;
    }


    /* =========================================================
       ACCIONES DE LOS BOTONES

       Utilizamos delegación de eventos para que los botones
       sigan funcionando después de volver a dibujar el carrito.
    ========================================================= */

    content.addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');

      if (!button || !content.contains(button)) {
        return;
      }

      const action = button.dataset.action;
      const id = button.dataset.id;

      if (action === 'increase') {
        qty(id, 1);
        return;
      }

      if (action === 'decrease') {
        qty(id, -1);
        return;
      }

      if (action === 'remove') {
        removeItem(id);
        return;
      }

      if (action === 'reserve') {
        if (!getCart().length) {
          return;
        }

        // Página de reserva que crearemos después.
        window.location.href = 'reserva.html';
      }
    });


    /* =========================================================
       CAMBIOS DESDE OTRA PESTAÑA
    ========================================================= */

    window.addEventListener('storage', event => {
      if (event.key !== CART_KEY && event.key !== null) {
        return;
      }

      render();
    });


    /* =========================================================
       CAMBIOS DESDE OTRAS PARTES DE VESIRA

       Importante: aquí solo actualizamos el contador visual.
       No volvemos a emitir vesira:cart-updated, evitando
       un bucle recursivo de eventos.
    ========================================================= */

    window.addEventListener('vesira:cart-updated', () => {
      setNavbarCartCount();
    });


    /* =========================================================
       INICIO
    ========================================================= */

    render();

  </script>

</body>
</html>
