
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vesira | Bienvenido</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: #0c0c0c;
      color: #fff;
      font-family: "Outfit", sans-serif;
    }

    .acceso {
      width: 100%;
      max-width: 470px;
      padding: 38px;
      border: 1px solid #292929;
      border-radius: 24px;
      background: #141414;
    }

    .acceso__logo {
      display: block;
      width: 170px;
      max-width: 75%;
      max-height: 75px;
      object-fit: contain;
      object-position: left center;
      margin-bottom: 30px;
    }

    .acceso__linea {
      height: 1px;
      margin-bottom: 28px;
      background: #303030;
    }

    .acceso__eyebrow {
      margin-bottom: 12px;
      color: #888;
      font-size: 10px;
      letter-spacing: .25em;
    }

    h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: clamp(42px, 9vw, 58px);
      line-height: .95;
      letter-spacing: -.06em;
    }

    .acceso__descripcion {
      margin-top: 16px;
      color: #aaa;
      font-size: 13px;
      line-height: 1.6;
    }

    fieldset {
      margin-top: 27px;
      border: 0;
    }

    legend {
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .opciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .opcion {
      position: relative;
      cursor: pointer;
    }

    .opcion input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .opcion span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1b1b1b;
      color: #ccc;
      font-size: 12px;
      text-align: center;
      transition: .2s ease;
    }

    .opcion input:checked + span {
      border-color: #fff;
      background: #fff;
      color: #111;
    }

    .opcion input:focus-visible + span {
      outline: 2px solid #aaa;
      outline-offset: 3px;
    }

    .acceso__error {
      margin-top: 18px;
      color: #ffaaa5;
      font-size: 12px;
    }

    .acceso__error:empty {
      display: none;
    }

    .acceso__boton {
      width: 100%;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s ease;
    }

    .acceso__boton:hover {
      background: #ddd;
    }

    .acceso__nota {
      margin-top: 16px;
      color: #777;
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 480px) {
      .acceso {
        padding: 26px 21px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="acceso">

    <img
      class="acceso__logo"
      src="img/logo2.png"
      alt="Vesira"
    >

    <div class="acceso__linea"></div>

    <p class="acceso__eyebrow">ANTES DE CONTINUAR</p>

    <h1>Un momento.</h1>

    <p class="acceso__descripcion">
      Confirma estas dos condiciones para continuar.
    </p>

    <form id="formAcceso">

      <fieldset>
        <legend>¿Eres de Canarias?</legend>

        <div class="opciones">
          <label class="opcion">
            <input type="radio" name="canarias"
                   value="si" required>
            <span>Sí, soy canario/a</span>
          </label>

          <label class="opcion">
            <input type="radio" name="canarias"
                   value="no" required>
            <span>No</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>¿Tienes 18 años o más?</legend>

        <div class="opciones">
          <label class="opcion">
            <input type="radio" name="edad"
                   value="si" required>
            <span>Sí</span>
          </label>

          <label class="opcion">
            <input type="radio" name="edad"
                   value="no" required>
            <span>No</span>
          </label>
        </div>
      </fieldset>

      <p class="acceso__error"
         id="errorAcceso"
         role="alert"></p>

      <button class="acceso__boton" type="submit">
        Continuar
        <span aria-hidden="true">↗</span>
      </button>

      <p class="acceso__nota">
        Debes cumplir ambas condiciones para continuar.
      </p>

    </form>
  </main>

  <script>
    const form = document.getElementById("formAcceso");
    const error = document.getElementById("errorAcceso");

    form.addEventListener("change", () => {
      error.textContent = "";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const canarias =
        form.querySelector('[name="canarias"]:checked')?.value;

      const edad =
        form.querySelector('[name="edad"]:checked')?.value;

      if (!canarias || !edad) {
        error.textContent =
          "Responde a las dos preguntas para continuar.";
        return;
      }

      // Si no tiene 18 años, irá a su propia página.
      if (edad === "no") {
        window.location.href = "menor-edad.html";
        return;
      }

      // Si es mayor de edad pero no es de Canarias.
      if (canarias === "no") {
        window.location.href = "no-canarias.html";
        return;
      }

      // Si cumple las dos condiciones.
      window.location.href = "tienda.html";
    });
  </script>

</body>
</html>
