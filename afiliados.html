<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0c0c">
  <meta name="description" content="Únete al programa de afiliados de 8 Reasons.">
  <title>Afiliados · 8 Reasons</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --fondo: #0c0c0c;
      --texto: #fff;
      --borde: #262626;
      --suave: #8d8d8d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Outfit", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

    /* El contenido se adapta al espacio que deja la navbar global. */
    main {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(690px, calc(100% - 38px));
      margin: 0 auto;
      padding: 78px 0 86px;
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 23px;
      color: var(--suave);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    h1 {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 600;
      letter-spacing: -.08em;
      line-height: .95;
    }

    .brand-logo {
      display: block;
      width: min(280px, 70vw);
      max-height: 115px;
      height: auto;
      object-fit: contain;
    }

    .description {
      max-width: 390px;
      margin: 26px auto 0;
      color: var(--suave);
      font-size: 13px;
      font-weight: 300;
      line-height: 1.8;
    }

    .cta-wrap {
      width: min(100%, 350px);
      margin: 36px auto 0;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      padding: 0 19px;
      border: 1px solid #fff;
      border-radius: 999px;
      background: #fff;
      color: #0c0c0c;
      font-size: 11px;
      font-weight: 600;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      background: transparent;
      color: #fff;
    }

    .arrow {
      display: grid;
      flex-shrink: 0;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 16px;
      line-height: 1;
    }

    .hint, .feedback {
      margin-top: 12px;
      color: #777;
      font-size: 10px;
      line-height: 1.7;
    }

    .feedback { min-height: 17px; color: #bdbdbd; }

    /* Mismo pie visual animado que en index.html. */
    .marquee-vesira {
      width: 100%;
      margin-top: auto;
      overflow: hidden;
      border-top: 1px solid var(--borde);
      padding: 30px 0;
      flex-shrink: 0;
    }

    .marquee-vesira-track {
      display: flex;
      width: max-content;
      animation: vesiraLoop 18s linear infinite;
    }

    .marquee-vesira-group {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      gap: 70px;
      padding-right: 70px;
    }

    .marquee-vesira-group img {
      display: block;
      flex-shrink: 0;
      width: 155px;
      height: 60px;
      object-fit: contain;
    }

    @keyframes vesiraLoop {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (max-width: 700px) {
      main { padding: 64px 0 68px; }
      .eyebrow { margin-bottom: 21px; font-size: 8px; }
      h1 { gap: 10px; font-size: clamp(46px, 12vw, 68px); }
      .brand-logo { width: min(235px, 68vw); max-height: 94px; }
      .description { max-width: 315px; margin-top: 22px; font-size: 12px; }
      .cta-wrap { margin-top: 30px; }
      .cta { min-height: 53px; font-size: 10px; }
      .marquee-vesira { padding: 24px 0; }
      .marquee-vesira-group { gap: 45px; padding-right: 45px; }
      .marquee-vesira-group img { width: 115px; height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Crece con nosotros</p>

    <h1>
      <span>Forma parte de</span>
      <img class="brand-logo" src="img/logo2.png" alt="8 Reasons">
    </h1>

    <p class="description">
      Comparte la marca, conecta con tu comunidad y gana una comisión por cada venta.
    </p>

    <div class="cta-wrap">
      <a class="cta" id="instagramLink" href="https://ig.me/m/vesira.co" target="_blank" rel="noopener noreferrer">
        <span>Hablar por Instagram</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <p class="hint">Pulsa y tendrás el mensaje listo para pegar en el chat.</p>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </div>
  </main>

  <footer class="marquee-vesira" aria-label="Marcas de 8 Reasons">
    <div class="marquee-vesira-track">
      <div class="marquee-vesira-group">
        <img src="img/logo2.png" alt="8 Reasons">
        <img src="img/logo15.png" alt="">
        <img src="img/logo2.png" alt="8 Reasons">
        <img src="img/logo15.png" alt="">
        <img src="img/logo2.png" alt="8 Reasons">
        <img src="img/logo15.png" alt="">
      </div>
      <div class="marquee-vesira-group" aria-hidden="true">
        <img src="img/logo2.png" alt="">
        <img src="img/logo15.png" alt="">
        <img src="img/logo2.png" alt="">
        <img src="img/logo15.png" alt="">
        <img src="img/logo2.png" alt="">
        <img src="img/logo15.png" alt="">
      </div>
    </div>
  </footer>

  <script>
    const MESSAGE = "Hola, equipo Vesira. Me interesa unirme al programa de afiliados. ¿Me contáis cómo funciona? ¡Gracias!";
    const instagramLink = document.getElementById("instagramLink");
    const feedback = document.getElementById("feedback");

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      let copied = false;
      try { copied = document.execCommand("copy"); } catch (_) {}
      textarea.remove();
      return copied;
    }

    instagramLink.addEventListener("click", async () => {
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(MESSAGE);
          copied = true;
        } else {
          copied = fallbackCopy(MESSAGE);
        }
      } catch (_) {
        copied = fallbackCopy(MESSAGE);
      }

      feedback.textContent = copied
        ? "Mensaje copiado. Pégalo en el chat de Instagram."
        : "Escríbenos por Instagram para unirte al programa.";
    });
  </script>

  <script src="vesira-navbar.js"></script>
</body>
</html>
